replicaCount: 3

image:
  repository: hazemmezgar/mern-client
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

env:
  - name: REACT_APP_SERVER_URL
    value: http://server:9000

ingress:
  enabled:  true
  annotations: {}
  hosts:
    - host: mern-app.local
      paths:
        - path: /
  tls: []